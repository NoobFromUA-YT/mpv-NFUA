# RIFE frame interpolation. These replace mpv's default window-size keys on Alt+0 to Alt+2.
Alt+0 script-message rife auto   # what each file starts with: the screen's rate
Alt+1 script-message rife 1   # off, original fps
Alt+2 script-message rife 2
Alt+3 script-message rife 3
Alt+4 script-message rife 4
Alt+5 script-message rife 5
Alt+6 script-message rife 6

# Step through the trim modes for heights the network cannot take as they are:
# always (leave rows out, fastest), nearest, no (pad, show every row).
Alt+8 script-message rife-trim cycle
Alt+KP8 script-message rife-trim cycle

# Step through installed RIFE models (Alt+m next, Alt+M previous). Saved across restarts.
Alt+m script-message rife-model cycle
Alt+M script-message rife-model prev

# Measure this PC's GPU and screen again and set the automatic multipliers from it
# (the performance assessor; it also runs by itself when script-opts/rife-preset.conf is missing).
Alt+9 script-message rife-assess
Alt+KP9 script-message rife-assess

# Step through the HDR looks (only HDR video changes): 1 deeper blacks and more colour
# (the default), 2 like the old renderer, 3 gpu-next's default.
Alt+7 script-message look
Alt+KP7 script-message look

# Numpad variants
Alt+KP0 script-message rife auto
Alt+KP1 script-message rife 1
Alt+KP2 script-message rife 2
Alt+KP3 script-message rife 3
Alt+KP4 script-message rife 4
Alt+KP5 script-message rife 5
Alt+KP6 script-message rife 6

# Playlist navigation
. playlist-next
, playlist-prev

# Mouse side buttons: closer = fullscreen, further = +10s forward
MBTN_BACK cycle fullscreen
MBTN_FORWARD seek 10

# Speed in whole 1x steps (scripts/speedstep.lua): + / = / numpad + faster, - / numpad - slower.
+ script-binding speedstep/speed-up
= script-binding speedstep/speed-up
KP_ADD script-binding speedstep/speed-up
- script-binding speedstep/speed-down
KP_SUBTRACT script-binding speedstep/speed-down

# o closes the player (o is also a quick-quit/external hook key); щ = o on the Ukrainian layout.
o quit
щ quit
