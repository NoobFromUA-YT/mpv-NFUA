# Native RIFE v4.6 frame interpolation (the "rife" video filter built into mpv-NFUA).
# This line is the fallback; scripts/rife.lua picks the multiplier (the largest that keeps
# the output at or below the screen's refresh rate and that the GPU can keep up with) and
# flow resolution. Alt+0 goes back to that, Alt+1 turns RIFE off, Alt+2..Alt+6 pick a
# fixed multiplier. All filter options: ./mpv-nfua --vf=rife=help
vf=@rife:rife=multiplier=2:trim=always

# The filter works on the decoder's own GPU surfaces, so decode on the GPU. Video the
# GPU cannot decode is decoded in software and uploaded, which also works.
hwdec=nvdec

# gpu-next + Vulkan/CUDA interop avoids legacy vo=gpu black-band flicker at high fps
# and enables Alt+7 HDR tone-mapping looks without CPU copies.
vo=gpu-next

# Treat SDR displays as following the exact sRGB curve for deeper blacks and cleaner
# shadows when tone-mapping HDR video (Alt+7 cycles looks; SDR video is unaffected).
treat-srgb-as-power22=no

# Vsync and timing are left at mpv defaults:
# gpu-api=auto, video-sync=audio, interpolation=no, framedrop=vo.
x11-bypass-compositor=no

# Keep shader & ICC caches portable inside the player directory
gpu-shader-cache-dir=~~/cache
icc-cache-dir=~~/cache

keep-open=yes
osd-duration=2500

# Prefer English audio when multiple tracks exist.
alang=en,eng,english

# Open large (e.g. 4K) videos centered at half-screen size instead of maximized.
autofit-larger=50%x50%

# RAM demuxer cache prevents stutters on network shares or slow disks.
# Systems with 32-64 GB RAM can raise these to 8GiB / 2GiB.
cache=yes
demuxer-max-bytes=2GiB
demuxer-max-back-bytes=512MiB
