# Native RIFE v4.6 frame interpolation (the "rife" video filter built into this mpv).
# This line is the fallback; scripts/rife.lua picks the multiplier (the largest that keeps
# the output at or below the screen's 160 Hz and that the GPU can keep up with) and flow resolution. Alt+0 goes back
# to that, Alt+1 turns RIFE off, Alt+2 to Alt+6 pick a fixed multiplier.
# All of the filter's options: ./mpv-rife --vf=rife=help
vf=@rife:rife=multiplier=2:trim=always

# The filter works on the decoder's own GPU surfaces, so decode on the GPU. Video the
# GPU cannot decode is decoded in software and uploaded, which also works.
hwdec=nvdec

# gpu-next, not the older "gpu": on Vulkan that one draws black bands over the picture in
# fullscreen at 144 fps (seen as flicker, worst with the on-screen controller showing).
# It does so with RIFE off too, so it is the renderer, not the filter.
vo=gpu-next

# HDR video shown on this SDR screen. Chosen by eye with Alt+7 (see scripts/look.lua):
# the screen is treated as following the exact sRGB curve, which gives deeper blacks and
# more colour than gpu-next's default (raised, washed-out shadows) or the old renderer's
# picture (target-contrast=inf, without the line below). SDR video is not affected.
treat-srgb-as-power22=no

# Vsync and timing are left at mpv's defaults:
# gpu-api=auto, video-sync=audio, interpolation=no, framedrop=vo.
x11-bypass-compositor=no

# Keep caches with the player
gpu-shader-cache-dir=~~/cache
icc-cache-dir=~~/cache

keep-open=yes
osd-duration=2500

# Prefer the English audio track when a file has several.
alang=en,eng,english

# Videos larger than half the screen (4K) open in a window of that size in the middle,
# like 1080p ones do, instead of a maximized window.
autofit-larger=50%x50%

# Big RAM cache (2026-11-12, user request; 64 GB RAM). mpv's default treats files on the
# 2nd PC's SMB share as local = ~1 s / 150 MB read-ahead, so share or disk hiccups could stutter.
# 8 GB ahead (~10 min of a 4K remux; user picked 8 GB) + 2 GB behind for instant seeks back.
# Undo: delete these lines (backup mpv.conf.bak-before-cache).
cache=yes
demuxer-max-bytes=8GiB
demuxer-max-back-bytes=2GiB
