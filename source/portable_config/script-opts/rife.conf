# Settings for scripts/rife.lua. Remove the # in front of a line to change it.

# The screen's refresh rate and the GPU's speed are measured by the performance
# assessor (scripts/rife.lua) into rife-preset.conf: at the first start, and again on
# Alt+9. Each video gets the largest whole multiplier that keeps it at or below the
# screen's rate and that the GPU can do. A line set here wins over the measurement:
#screen_fps=160

# no: never measure by itself (Alt+9 still does).
#assess=yes

# 4K videos faster than this play without RIFE.
uhd_max_fps=30

# Heights the network cannot take as they are (1080 and 2160 among them):
#   always   leave rows out at the top and bottom to reach the size below (faster)
#   nearest  do that only when it loses fewer rows than padding would add
#   no       always pad, show every row
trim=always

# Megapixels the GPU interpolates per second at full and at half flow resolution
# (RTX 4070 Ti). Used only when the assessor has no measurement.
#full_flow_rate=280
#half_flow_rate=370
