# Replace /path/to/mpv-nfua with your local checkout directory before cross-compiling.
[binaries]
c = '/path/to/mpv-nfua/toolchain/win/llvm-mingw/bin/x86_64-w64-mingw32-clang'
cpp = '/path/to/mpv-nfua/toolchain/win/llvm-mingw/bin/x86_64-w64-mingw32-clang++'
ar = '/path/to/mpv-nfua/toolchain/win/llvm-mingw/bin/x86_64-w64-mingw32-ar'
strip = '/path/to/mpv-nfua/toolchain/win/llvm-mingw/bin/x86_64-w64-mingw32-strip'
windres = '/path/to/mpv-nfua/toolchain/win/llvm-mingw/bin/x86_64-w64-mingw32-windres'
pkg-config = 'pkg-config'

[built-in options]
c_args = ['-I/path/to/mpv-nfua/toolchain/win/sysroot/clang64/include']
cpp_args = ['-I/path/to/mpv-nfua/toolchain/win/sysroot/clang64/include']
c_link_args = ['-L/path/to/mpv-nfua/toolchain/win/sysroot/clang64/lib', '-static-libstdc++']
cpp_link_args = ['-L/path/to/mpv-nfua/toolchain/win/sysroot/clang64/lib', '-static-libstdc++']

[properties]
sys_root = '/path/to/mpv-nfua/toolchain/win/sysroot'
pkg_config_libdir = '/path/to/mpv-nfua/toolchain/win/sysroot/clang64/lib/pkgconfig:/path/to/mpv-nfua/toolchain/win/sysroot/clang64/share/pkgconfig'

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
