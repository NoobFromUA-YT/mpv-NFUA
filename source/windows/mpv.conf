# Native RIFE v4.6 frame interpolation (the "rife" video filter built into this mpv).
# This line is the fallback; scripts/rife.lua picks the multiplier (the largest that keeps
# the output at or below the screen's refresh rate and that the GPU can keep up with) and
# flow resolution. Alt+0 goes back to that, Alt+1 turns RIFE off, Alt+2 to Alt+6 pick a
# fixed multiplier. All of the filter's options: mpv.com --vf=rife=help
vf=@rife:rife=multiplier=2:trim=no

# The filter works on the decoder's own GPU surfaces, so decode on the GPU. Video the
# GPU cannot decode is decoded in software and uploaded, which also works.
hwdec=nvdec

# Vulkan + gpu-next, not mpv's Windows default (Direct3D 11): only Vulkan and OpenGL
# can take frames straight from CUDA memory, and Alt+7 HDR looks need gpu-next.
vo=gpu-next
gpu-api=vulkan

# HDR video shown on an SDR screen (Alt+7 steps through looks).
treat-srgb-as-power22=no

# Keep caches with the player
gpu-shader-cache-dir=~~/cache
icc-cache-dir=~~/cache

keep-open=yes
osd-duration=2500

# Prefer the English audio track when a file has several.
alang=en,eng,english

# Videos larger than half the screen (4K) open in a window of that size in the middle.
autofit-larger=50%x50%

# Big RAM cache (~10 min of a 4K remux ahead + 2 GB behind for instant seeks).
cache=yes
demuxer-max-bytes=8GiB
demuxer-max-back-bytes=2GiB
